<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Port Murray</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%93%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,700;0,800;1,500&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--paper:#f3eedf;--leaf:#fffdf6;--ink:#26231d;--muted:#6a6455;--rule:#ddd3bb;--sage:#55704d;--sage-d:#3f5639;--sage-wash:#e4e9d7;
--barn:#9e3328;--barn-wash:#f6e2dc;--gold:#a8741a;--sky:#4f6a8f;
--display:'Alegreya',Georgia,'Times New Roman',serif;--body:'Alegreya Sans',-apple-system,'Segoe UI',Arial,sans-serif;--r:10px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16.5px/1.45 var(--body)}
a{color:inherit;text-decoration-color:var(--sage);text-underline-offset:2px}a:hover{color:var(--barn)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--barn);outline-offset:2px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--sage)}
.bar{max-width:1500px;margin:0 auto;padding:10px 24px 0;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex:1 1 auto;min-width:0}
.brand h1{font:800 34px/1 var(--display);margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand h1 a{text-decoration:none}
.brand .sub{font:500 14px var(--body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:0 1 320px;position:relative;margin-bottom:6px}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--rule);border-radius:999px;background:var(--leaf)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55}
nav.tabs{max-width:1500px;margin:0 auto;padding:8px 24px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--rule);border-bottom:0;background:var(--sage-wash);border-radius:10px 10px 0 0;
 padding:9px 16px 8px;font:700 16.5px var(--display);cursor:pointer;white-space:nowrap}
nav.tabs button .ct{font:500 12.5px var(--body);color:var(--muted);margin-left:6px}
nav.tabs button .nw{font:700 11px var(--body);color:#fff;background:var(--barn);border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:2px}
nav.tabs button[aria-current=page]{background:var(--sage);border-color:var(--sage);color:#fff}
nav.tabs button[aria-current=page] .ct{color:#e8eedf}
/* layout */
.wrap{max-width:1500px;margin:0 auto;padding:18px 24px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px}
.wrap.full{grid-template-columns:minmax(0,1fr)}.wrap.full aside{display:none}
aside{position:sticky;top:112px;align-self:start;max-height:calc(100vh - 130px);overflow:auto}
aside .grp{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px}
.subs{list-style:none;margin:0;padding:0}
.subs button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;
 padding:9px 12px;border-radius:8px;cursor:pointer;font:600 16px var(--body)}
.subs button:hover{background:var(--sage-wash)}
.subs button[aria-current=true]{background:var(--leaf);box-shadow:inset 3px 0 0 var(--barn);font-weight:800}
.subs .ct{font:500 13px var(--body);color:var(--muted)}.subs .ct b{color:#365b78}
.subs .kids{list-style:none;margin:0 0 4px 14px;padding:0 0 0 8px;border-left:1px solid var(--rule)}
.subs .kids button{font-size:15px;padding:6px 10px}
.cal{display:block;margin:16px 4px 0;font-size:14px;color:var(--sage-d)}
/* chips (phone menu) */
.chips{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--rule);background:var(--leaf);border-radius:999px;padding:6px 12px;font:600 14.5px var(--body);cursor:pointer;white-space:nowrap}
.chips button[aria-current=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips.kids button{font-size:13.5px;padding:4px 10px}
.lcard .blurb{font-size:13.5px;color:var(--muted,#5b6470);line-height:1.35;margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips .chipnew{font:700 11px var(--body);color:#fff;background:#365b78;border-radius:999px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.chips button[aria-current=true] .chipnew{background:#fff;color:#365b78}
/* main */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.head h2{font:800 32px/1.05 var(--display);margin:0}
.head h2 .ct{font:500 15px var(--body);color:var(--muted);margin-left:10px}
.lede{color:var(--muted);margin:0 0 14px;max-width:780px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.controls label{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.controls select{border:1px solid var(--rule);background:var(--leaf);border-radius:8px;padding:6px 8px}
.controls .chk{border:1px solid var(--rule);background:var(--leaf);border-radius:8px;padding:6px 10px;color:var(--ink)}
h3.sec{font:700 22px var(--display);margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}
h3.sec .more{font:600 14px var(--body);color:var(--sage-d);cursor:pointer;background:none;border:0;text-decoration:underline}
h4.day{font:italic 700 20px var(--display);color:var(--sage-d);margin:22px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
h4.day:first-child{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.grid.big{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.empty-note{color:var(--muted);font-style:italic;padding:12px 0}
.home-note{margin:-6px 0 22px;color:var(--muted);font-size:15px}
.home-list .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr))}
.home-list .card:nth-child(n+7){display:none}.home-list.open .card{display:flex}
.home-list .card .facts{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sales-more{margin-top:12px}
.sec-note{font:500 14px var(--body);color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--sage-d);text-decoration:underline;cursor:pointer;font:inherit;font-style:normal}
nav.tabs .sm{display:none}
.morebtn{display:block;margin:18px auto 0;border:1px solid var(--sage);background:var(--leaf);color:var(--sage-d);border-radius:999px;padding:9px 22px;font:700 15px var(--body);cursor:pointer}
/* item card */
.card{position:relative;display:flex;gap:12px;background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r);padding:12px;min-width:0}
.card.hl,.lcard.hl,.pcard.hl{box-shadow:0 0 0 3px var(--gold)}
.when{flex:0 0 70px;text-align:center;border-radius:8px;background:var(--sage-wash);color:var(--sage-d);padding:6px 4px;align-self:flex-start}
.when .k{display:block;font:800 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase}
.when .m{display:block;font:800 13px var(--body);text-transform:uppercase;margin-top:2px}
.when .d{display:block;font:800 30px/1 var(--display)}
.when .w{display:block;font:600 12px var(--body)}
.when.soon{background:var(--barn);color:#fff}.when.past{background:#ece6d6;color:var(--muted)}
.when.posted{background:#ece6d6;color:#4c473c}
.body{flex:1;min-width:0;padding-right:30px}
.grid.jobs{grid-template-columns:repeat(auto-fill,minmax(min(100%,390px),1fr))}
.date-guide{font-size:13.5px;color:var(--muted);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:7px 18px}
.date-guide span{display:inline-flex;align-items:center;gap:5px}
.date-guide i{width:9px;height:9px;background:var(--sage);border-radius:50%}
.date-guide .soon-dot{background:var(--barn)}.date-guide .new-dot{background:#365b78}
.career-pages{margin:0 0 16px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;background:var(--leaf);font-size:14px}
.career-pages summary{cursor:pointer;font-weight:700;color:var(--sage-d)}
.career-pages ul{display:flex;flex-wrap:wrap;gap:8px 24px;list-style:none;margin:10px 0 2px;padding:0}
.freshness{border-left:3px solid var(--gold);background:#f5e7bd;padding:10px 14px;margin-bottom:16px;font-size:14px}
.body a.t{font:700 17px/1.3 var(--body);text-decoration:none;overflow-wrap:anywhere}
.body a.t:hover{text-decoration:underline}
.facts{font-size:15px;margin-top:3px;color:#3d392f;overflow-wrap:anywhere}
.meta{font-size:13.5px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.keyfacts{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 2px}
.fact{display:inline-flex;align-items:center;border-radius:999px;background:var(--sage-wash);color:var(--sage-d);padding:3px 8px;font:700 13px var(--body)}
.fact.distance{background:#e4ebf2;color:#354f70}.fact.pay{background:#f5e7bd;color:#72500d}.fact.pricefact{background:var(--barn-wash);color:#7b291f}
.rel{font-weight:700;color:var(--barn)}
.acts{display:flex;gap:12px;margin-top:6px;font-size:13.5px}
.acts button,.acts a{background:none;border:0;padding:0;color:var(--sage-d);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.star{background:none;border:0;cursor:pointer;font-size:22px;line-height:1;color:#8f8466;padding:0;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.star.on{color:var(--gold)}
.card .star{position:absolute;right:0;bottom:0}  /* clear of the thumbnail */
.thumb{flex:0 0 92px;width:92px;height:92px;border-radius:8px;object-fit:cover;background:#e6dfcc}
.badge{display:inline-block;font:800 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--barn);border-radius:4px;padding:2px 6px;margin-right:6px;vertical-align:2px}
.badge.cut{background:var(--gold)}.badge.soft{background:var(--sage)}
.badge:not(.cut):not(.soft),nav.tabs button .nw{background:#365b78}
/* listing card (Zillow style) */
.lcard,.pcard{position:relative;background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{position:relative;aspect-ratio:16/10;background:#d9d1bb center/cover no-repeat;display:block;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .ph{aspect-ratio:1/1;background:#efe8d6}
.pcard .ph img{object-fit:contain}  /* the whole animal, never a cropped head or tail */
.ph .sat{position:absolute;inset:0;background-repeat:no-repeat}
.ph .pin{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--barn);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.ph .cap{position:absolute;right:6px;bottom:5px;font-size:10.5px;color:#fff;text-shadow:0 1px 2px #000}
.ph .badges{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap}
.ph .initial{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 64px var(--display);color:#fff;background:linear-gradient(135deg,var(--sage),var(--sage-d))}
.lcard .star,.pcard .star{position:absolute;right:2px;top:0;font-size:24px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2}
.lcard .star.on,.pcard .star.on{color:#ffcf5a}
.lb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.price{font:800 24px/1.1 var(--body)}
.price small{font:600 13px var(--body);color:var(--muted);margin-left:6px}
.price s{font:500 14px var(--body);color:var(--muted);margin-left:6px}
.specs{font-size:15px;color:#3d392f}.specs b{font-weight:800}
.addr{font:600 15px var(--body);overflow-wrap:anywhere}
.why-fit{margin:4px 0 2px;padding:5px 9px;border-radius:8px;background:var(--sage-wash);color:var(--sage-d);font:600 13.5px/1.35 var(--body)}
.addr a{text-decoration:none}.addr a:hover{text-decoration:underline}
.listed{margin-top:auto;padding-top:6px;font-size:13.5px;color:var(--muted)}
.listed b{color:var(--ink)}
.pcard .why{margin:6px 0 2px;padding:6px 9px;border-radius:8px;background:var(--sage-wash);font-size:14px;line-height:1.35}
.pcard .bio{margin:6px 0 2px;color:#4c473c;font-size:14px;line-height:1.35}
.pcard .name{font:800 21px/1.15 var(--display)}
.jobpay{font:800 19px/1.2 var(--body);color:#72500d;margin-top:5px}.employer{font-weight:700;color:#3d392f;margin-top:2px}
.home-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,340px);gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:1px 2px 10px;scrollbar-color:var(--sage) transparent}
.home-row>article{scroll-snap-align:start}
.home-row{align-items:start}
.home-row .card .facts{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.home-row .card{flex-wrap:wrap}.home-row .card .thumb{order:-1;flex:1 0 100%;width:100%;height:150px}  /* narrow row cards: photo on top, text gets the width */
/* blocks */
.block{background:var(--leaf);border:1px solid var(--rule);border-left:4px solid var(--sage);border-radius:var(--r);padding:12px 16px;margin:0 0 16px;overflow-x:auto}
.block h4{font:700 18px var(--display);margin:0 0 6px}
.block ul,.block ol{margin:6px 0;padding-left:20px}.block li{margin:0 0 6px}
.block img.pet{max-width:100%;max-height:340px;object-fit:cover;height:auto;border-radius:8px;display:block;margin:6px 0}
.wx{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:8px 0 10px}.wxd{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 8px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.wxd.today{background:var(--sage-wash);border:2px solid var(--sage)}.wxd.wet .wxr{color:#2f4a70;font-weight:800}  /* today is highlighted; rain shows in the rain line */.wxn{font:700 15px var(--display);letter-spacing:.02em}.wxi{font-size:44px;line-height:1.1}.wxt b{font-size:22px}.wxlo{color:var(--muted);font-size:15px}.wxs{font-size:12.5px;color:var(--muted);line-height:1.25;min-height:2.5em}.wxr{font-size:13px;color:var(--sky);font-weight:700;width:100%}.wxbar{display:block;height:5px;border-radius:3px;background:var(--rule);margin-top:3px;overflow:hidden}.wxbar i{display:block;height:100%;background:var(--sky)}.wxalerts li{color:var(--barn)}
.block table{border-collapse:collapse;width:100%;font-size:14px}.block td,.block th{border-bottom:1px solid var(--rule);padding:5px 4px;text-align:left;vertical-align:top}
.block .meta{font-size:13.5px}
.duo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:stretch;margin:18px 0 24px}
.duo.single{grid-template-columns:minmax(0,1fr)}.duo>.block{margin:0;min-width:0}
.animal-feature{display:flex;flex-direction:column;overflow:hidden}
.animal-spotlight{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;flex:1}
.animal-photo{display:block;aspect-ratio:1/1;border-radius:8px;background:var(--paper);overflow:hidden}
.animal-photo img{display:block;width:100%;height:100%;object-fit:contain}
.animal-copy{position:relative;min-width:0;padding-right:20px}
.animal-copy h3{font:800 25px/1.12 var(--display);margin:0 0 8px;overflow-wrap:anywhere}
.animal-copy h3 a{text-decoration:none}.animal-copy .star{position:absolute;right:-14px;top:-10px}
.animal-copy .animal-bio{color:var(--muted);font-size:15px;margin:8px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.animal-copy .animal-link{display:inline-block;margin-top:8px;font-weight:700;color:var(--sage-d)}
.week-heading{justify-content:space-between;flex-wrap:wrap;margin-top:24px!important}
.week-heading small{font:500 14px var(--body);color:var(--muted)}
.week-agenda{background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.week-day{display:grid;grid-template-columns:112px minmax(0,1fr);border-bottom:1px solid var(--rule)}
.week-day:last-of-type{border-bottom:0}
.week-date{margin:0;padding:18px 16px;background:#ecefdf;color:var(--sage-d);font:700 17px var(--display);display:flex;flex-direction:column;gap:2px}
.week-date small{font:600 13px var(--body)}.week-date.soon{background:var(--barn-wash);color:var(--barn)}
.week-events{min-width:0;padding:0 18px}
.week-event{position:relative;padding:13px 40px 13px 0;border-bottom:1px solid #e9e2d1;min-width:0}
.week-event:last-child{border-bottom:0}.week-event .star{position:absolute;right:-8px;top:2px}
.week-event .t{font:700 17px/1.3 var(--body);text-decoration:none;overflow-wrap:anywhere;display:inline-block}
.week-event .t:hover{text-decoration:underline}.week-event .meta{margin-top:4px}
.week-event .event-kind{color:var(--sage-d);font-weight:700}
.week-event .event-time{color:var(--barn);font-weight:700}
.week-agenda .week-day.extra{display:none}.week-agenda.open .week-day.extra{display:grid}
.week-agenda .week-event.extra{display:none}.week-agenda.open .week-event.extra{display:block}
.week-agenda .morebtn{margin:12px auto}
.week-agenda .acts{margin-top:5px}
.duo .pcard .ph{aspect-ratio:16/9}.duo .pcard .ph img{object-fit:contain;background:#efe8d6}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:8px}
.tile{background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--sage)}
.tile b{display:block;font:800 26px var(--display)}.tile span{color:var(--muted);font-size:14px}
.agenda{background:var(--leaf);border:1px solid var(--rule);border-radius:var(--r);padding:4px 16px 12px}
.agenda .row{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid #ece4cf;align-items:baseline}
.agenda .row:last-child{border-bottom:0}
.agenda .row.extra{display:none}.agenda.open .row.extra{display:grid}.agenda .morebtn{margin:10px auto 0}
.agenda .dt{font:800 14px var(--body);color:var(--sage-d)}.agenda .dt.soon{color:var(--barn)}
.agenda .tg{font-size:12.5px;color:var(--muted);white-space:nowrap}
.agenda a{font-weight:600;text-decoration:none}.agenda a:hover{text-decoration:underline}
footer{max-width:1500px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:13.5px}
@media (max-width:900px){
 .wrap{grid-template-columns:minmax(0,1fr);gap:0;padding:12px 16px 50px}
 aside{display:none}.chips{display:flex}
 .bar{padding:8px 16px 0;gap:8px}.brand h1{font-size:28px}.brand .sub{font-size:12.5px}.brand .place{display:none}
 .search{flex:1 1 100%;margin-bottom:0}
 nav.tabs{padding:8px 16px 0}nav.tabs button{padding:8px 12px 7px;font-size:15.5px}
 nav.tabs{flex-wrap:wrap;gap:6px;padding:8px 16px 10px}
 nav.tabs button{border:1px solid var(--rule);border-radius:999px;padding:5px 11px}
 .head h2{font-size:26px}
 .grid{grid-template-columns:minmax(0,1fr)}.grid.big{grid-template-columns:repeat(2,minmax(0,1fr))}
 .home-list .card:nth-child(n+5){display:none}.home-list.open .card{display:flex}
 .home-row{grid-auto-columns:minmax(260px,min(88vw,360px))}  /* a lone card stays card-sized on a tablet */
 .duo{grid-template-columns:minmax(0,1fr)}
 .animal-spotlight{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
 .animal-photo{aspect-ratio:4/3}
 .animal-copy h3{font-size:22px}.animal-copy .animal-bio{font-size:14px;-webkit-line-clamp:3}
 .week-day{grid-template-columns:76px minmax(0,1fr)}
 .week-date{padding:14px 9px;font-size:16px}.week-date small{font-size:12px}
